<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co ; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<script>if (window.top !== window.self) { window.top.location = window.self.location; }</script>
<title>커리어링크 관리자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 좌측 고정 사이드바 + 업무 영역(요약 → 표 → 우측 상세 패널). 기존 시제품 보라 톤 유지 */
:root{
  --bg:#f5f4fa; --surface:#ffffff; --surface-2:#faf9fd; --ink:#24213a; --sub:#6c6884; --faint:#9894ad;
  --line:#e6e3ef; --line-strong:#d6d2e4;
  --accent:#6854e8; --accent-deep:#5140d4; --accent-soft:#efecff; --on-accent:#ffffff;
  --good:#0f7a5f; --good-soft:#e2f5ee; --warn:#94650f; --warn-soft:#fdf1d8; --bad:#b03f3f; --bad-soft:#fde9e9;
  --info:#2f6bb3; --info-soft:#e6f0fb; --mute-soft:#eeedf3;
  --shadow:0 12px 32px rgba(40,30,90,.10);
  --f-body:"IBM Plex Sans KR",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121d; --surface:#1c1a28; --surface-2:#211f2f; --ink:#ecebf5; --sub:#a7a3bd; --faint:#7b7792;
  --line:#2e2b3e; --line-strong:#3c3851;
  --accent:#9c8eff; --accent-deep:#b4a9ff; --accent-soft:#2a2547; --on-accent:#15122a;
  --good:#5fd3ad; --good-soft:#163a31; --warn:#e8bf6a; --warn-soft:#3b2f15; --bad:#f08f8f; --bad-soft:#3d1f22;
  --info:#8ab8f0; --info-soft:#1c2c42; --mute-soft:#2a2838; --shadow:0 12px 32px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121d; --surface:#1c1a28; --surface-2:#211f2f; --ink:#ecebf5; --sub:#a7a3bd; --faint:#7b7792;
  --line:#2e2b3e; --line-strong:#3c3851;
  --accent:#9c8eff; --accent-deep:#b4a9ff; --accent-soft:#2a2547; --on-accent:#15122a;
  --good:#5fd3ad; --good-soft:#163a31; --warn:#e8bf6a; --warn-soft:#3b2f15; --bad:#f08f8f; --bad-soft:#3d1f22;
  --info:#8ab8f0; --info-soft:#1c2c42; --mute-soft:#2a2838; --shadow:0 12px 32px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px}
h1,h2,h3{text-wrap:balance;margin:0}

/* demo banner */
.demo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 14px;font-size:12.5px;margin-bottom:14px}
.demo b{font-weight:600}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px;letter-spacing:-.3px}
.brand small{display:block;font-size:10px;letter-spacing:1.2px;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;letter-spacing:.8px;color:var(--faint);padding:10px 10px 4px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;color:var(--sub);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.nav .cnt{font-size:11px;background:var(--mute-soft);color:var(--sub);border-radius:99px;padding:1px 8px}
.nav .soon{font-size:10px;color:var(--faint)}
.me{border-top:1px solid var(--line);padding:14px 6px 0;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.me .who b{display:block}
.me .who span{color:var(--sub)}
.me .row{display:flex;gap:6px;flex-wrap:wrap}
.idle{font-size:11.5px;color:var(--faint)}

/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:22px;letter-spacing:-.6px}
.head p{margin:4px 0 0;color:var(--sub);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel h2{font-size:15px;letter-spacing:-.2px}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel .ph small{color:var(--sub);font-size:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent-deep);font-weight:600;padding:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;text-align:left}
button.kpi:hover{border-color:var(--accent)}
.kpi .lbl{font-size:12.5px;color:var(--sub)}
.kpi strong{font-size:28px;letter-spacing:-1px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--sub)}
.kpi.attn{border-color:var(--warn);background:var(--warn-soft)}
.kpi.attn .lbl,.kpi.attn .sub{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-seeking{background:var(--info-soft);color:var(--info)}
.s-employed{background:var(--good-soft);color:var(--good)}
.s-startup{background:var(--accent-soft);color:var(--accent-deep)}
.s-education{background:var(--warn-soft);color:var(--warn)}
.s-other{background:var(--mute-soft);color:var(--sub)}
.s-unknown{background:transparent;color:var(--faint);border:1px dashed var(--line-strong)}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;background:var(--mute-soft);color:var(--sub)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input,.select,.textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:8px 11px;font-size:13px;min-width:0}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar .search{flex:1 1 240px}
.toolbar .select{flex:0 1 auto;max-width:220px}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12.5px;color:var(--sub);display:inline-flex;gap:6px;align-items:center}
.seg b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.seg.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
.seg.on b{color:var(--accent-deep)}

/* table */
.tablebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 8px}
.tablebar .count{font-size:13px;color:var(--sub)}
.tablebar .count b{color:var(--ink);font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:62vh}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;white-space:nowrap}
table.grid th{position:sticky;top:0;z-index:1;background:var(--surface-2);color:var(--sub);font-weight:600;font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
table.grid th button{border:0;background:none;padding:0;color:inherit;font-weight:inherit;display:inline-flex;gap:4px;align-items:center}
table.grid th .arr{color:var(--accent-deep)}
table.grid td{padding:7px 10px;border-bottom:1px solid var(--line);max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover td{background:var(--accent-soft)}
table.grid tbody tr.sel td{background:var(--accent-soft)}
table.grid td.code{font-family:var(--f-mono);font-size:12px;color:var(--sub)}
table.grid td.name{font-weight:600}
td.dim,span.dim{color:var(--faint)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--sub)}
.pager .pg{display:flex;gap:4px;flex-wrap:wrap}
.pager .pg button{min-width:32px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:4px 8px;font-variant-numeric:tabular-nums}
.pager .pg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* column picker */
.pop{position:relative}
.popbox{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:12px;width:min(360px,80vw);display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.popbox label{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:3px 0}
.popbox .pf{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}

/* charts */
.bars{display:flex;flex-direction:column;gap:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--mute-soft)}
.stack span{display:block;height:100%}
.slist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;margin-top:12px}
.slist button{display:flex;justify-content:space-between;gap:6px;align-items:center;border:0;background:none;padding:4px 0;font-size:12.5px;color:var(--sub);text-align:left}
.slist button:hover{color:var(--ink)}
.slist b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
svg text{font-family:var(--f-body)}

/* simple lists */
.rows{display:flex;flex-direction:column}
.rows .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.rows .r:last-child{border-bottom:0}
.rows .r small{display:block;color:var(--sub);font-size:12px}
.rows button.r{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.rows button.r:hover{background:var(--surface-2)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,16,40,.38);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--surface);z-index:31;display:flex;flex-direction:column;box-shadow:var(--shadow);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{padding:18px 22px 0;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.dh .t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh h2{font-size:20px;letter-spacing:-.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dh .meta{color:var(--sub);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--sub);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent-deep);border-bottom-color:var(--accent);font-weight:600}
.db{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:18px}
.df{border-top:1px solid var(--line);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2)}
.df .msg{font-size:12.5px;color:var(--sub)}
fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
legend{font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--accent-deep);padding:0;margin-bottom:10px;grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;color:var(--sub);font-weight:500}
.f .hint{font-size:11.5px;color:var(--faint)}
.f .err{font-size:11.5px;color:var(--bad)}
.f.bad .input{border-color:var(--bad)}
.f.changed label::after{content:" · 수정됨";color:var(--accent-deep)}
.textarea{min-height:76px;resize:vertical}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card.cur{border-color:var(--good)}
.card .ct{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.card .ct b{font-size:14px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:4px 0 0;font-size:12.5px}
.card dt{color:var(--sub)}
.card dd{margin:0}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.tl time{color:var(--sub);font-variant-numeric:tabular-nums}
.tl .what b{font-weight:600}
.tl .what s{color:var(--faint)}
.tl .by{color:var(--faint);font-size:11.5px}

/* login */
.login{min-height:calc(100vh - 32px);display:grid;place-items:center}
.lcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.lcard h1{font-size:21px;letter-spacing:-.5px}
.lcard p{margin:0;color:var(--sub);font-size:13px}
.lcard form{display:flex;flex-direction:column;gap:12px}
.lcard .err{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:12.5px}
.creds{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--sub);line-height:1.7}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(20,16,40,.38);padding:16px}
.mbox{width:min(440px,100%);background:var(--surface);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.mbox h3{font-size:16px}
.mbox p{margin:0;color:var(--sub);font-size:13px;line-height:1.6}
.mbox .acts{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px}
#toast div{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:var(--shadow);max-width:360px}

.empty{padding:40px 16px;text-align:center;color:var(--sub);font-size:13px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.steps .card b{font-size:13.5px}
.steps .card p{margin:0;font-size:12.5px;color:var(--sub);line-height:1.6}
.steps .card .n{font-family:var(--f-mono);font-size:11px;color:var(--accent-deep)}

/* STEP 3 · upload */
.stepper{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.stepper span{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:99px;background:var(--mute-soft);color:var(--sub)}
.stepper span b{font-family:var(--f-mono);font-weight:500}
.stepper span.on{background:var(--accent);color:var(--on-accent)}
.stepper span.done{background:var(--accent-soft);color:var(--accent-deep)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line-strong);border-radius:14px;padding:34px 16px;text-align:center;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0;color:var(--sub);font-size:13px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.samples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.maprow-ex{color:var(--faint);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.maptable select{min-width:190px}
.maptable tr.locked td{background:var(--bad-soft)}
.maptable tr.auto .src{color:var(--good)}
.maptable tr.man .src{color:var(--accent-deep)}
.maptable tr.skip td:not(:last-child){color:var(--faint)}
.issues{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px;accent-color:var(--accent)}
.badge{display:inline-block;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-new{background:var(--accent-soft);color:var(--accent-deep)}
.b-link{background:var(--good-soft);color:var(--good)}
.b-dup{background:var(--warn-soft);color:var(--warn)}
.b-error{background:var(--bad-soft);color:var(--bad)}
.b-skip{background:var(--mute-soft);color:var(--sub)}
.msgs{display:flex;flex-direction:column;gap:2px;white-space:normal;min-width:260px;max-width:440px;font-size:12px;line-height:1.45}
.msgs .e{color:var(--bad)}
.msgs .w{color:var(--warn)}
.msgs .i{color:var(--sub)}
table.grid td.wrap{white-space:normal;max-width:440px}
table.prev tbody tr{cursor:default}
table.prev tbody tr:hover td{background:transparent}
table.prev tr.err td{background:var(--bad-soft)}
table.prev select{padding:4px 6px;font-size:12px}
.progress{height:10px;border-radius:99px;background:var(--mute-soft);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}
.result{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.result div{border:1px solid var(--line);border-radius:12px;padding:12px 14px}

<script>document.write('<script src="config.js?v=' + Date.now() + '"><\/script>');</script>
<script>
/* =====================================================================
   오픈놀 커리어링크 관리자 페이지 · STEP 2 (가상 데이터 체험판)
   - 데이터 계층(store)만 바꾸면 STEP 4에서 Supabase로 연결됩니다.
   - 이 체험판의 모든 데이터는 가상이며, 새로고침하면 처음 상태로 돌아갑니다.
   ===================================================================== */
'use strict';
const CFG = window.CAREERLINK_CONFIG || {};
const DEMO = !CFG.SUPABASE_URL;   // config.js에 Supabase 주소가 없으면 가상 데이터 체험판으로 동작
const IDLE_MIN = 30;

/* ---------- 공통 상수 ---------- */
const STATUS = {seeking:'구직 중', employed:'재직 중', startup:'창업 중', education:'진학·교육 중', other:'기타', unknown:'미확인'};
const STATUS_ORDER = ['employed','startup','seeking','education','other','unknown'];
const STATUS_COLOR = {employed:'var(--good)', startup:'var(--accent)', seeking:'var(--info)', education:'var(--warn)', other:'var(--faint)', unknown:'var(--line-strong)'};
const JOBS = ['마케팅·홍보','기획·PM','개발·데이터','디자인','경영지원·인사','영업·MD','교육·서비스'];
const EMP_TYPES = ['정규직','계약직','인턴','프리랜서','일용직','기타'];
const EDU = ['고등학교 졸업','전문대 재학','전문대 졸업','대학 재학','대학 졸업','대학원 이상'];

/* ---------- 유틸 ---------- */
const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtNum = n => Number(n||0).toLocaleString('ko-KR');
const fmtDT = iso => { if(!iso) return ''; const d = new Date(iso); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtD = iso => iso ? iso.slice(0,10).replace(/-/g,'.') : '';
// 생년월일: 저장 YYYY-MM-DD ↔ 화면 YY-MM-DD
function birthToYY(iso){ return iso ? iso.slice(2) : ''; }
function yyToBirth(s){
  const m = String(s||'').trim().match(/^(\d{2})-(\d{2})-(\d{2})$/); if(!m) return null;
  const cur = new Date().getFullYear() % 100; const yy = +m[1];
  const y = (yy <= cur ? 2000 : 1900) + yy, mo = +m[2], d = +m[3];
  const dt = new Date(Date.UTC(y, mo-1, d));
  if(dt.getUTCMonth() !== mo-1 || dt.getUTCDate() !== d) return null;
  return `${y}-${pad(mo)}-${pad(d)}`;
}
function age(iso, base = todayISO()){
  if(!iso) return null; const [y,m,d] = iso.split('-').map(Number); const [by,bm,bd] = base.split('-').map(Number);
  return by - y - ((bm < m || (bm === m && bd < d)) ? 1 : 0);
}
function normPhone(s){
  const d = String(s||'').replace(/\D/g,''); if(!d) return '';
  if(/^01[016789]\d{7,8}$/.test(d)) return d.length === 11 ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}` : `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  return null;
}
const maskPhone = p => p ? p.replace(/^(\d{3})-(\d{3,4})-(\d{4})$/, '$1-****-$3') : '';
const validEmail = s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
const chip = s => `<span class="chip s-${s}">${STATUS[s]}</span>`;
function toast(msg){ const el = document.createElement('div'); el.textContent = msg; $('#toast').appendChild(el); setTimeout(()=>el.remove(), 3600); }
const store_ls = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };

/* =====================================================================
   가상 데이터 생성 (결정적 난수 — 매번 같은 데이터)
   ===================================================================== */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function genDemo(){
  const R = mulberry32(20261106); const pick = a => a[Math.floor(R()*a.length)]; const chance = p => R() < p;
  const SUR = ['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권','황','안','송','류','홍'];
  const GIV = ['민','서','지','현','수','준','우','연','하','윤','은','도','예','주','유','진','성','태','채','나','가','온','슬','린','호','빈','원','아','혜','경'];
  const GU = [['서울특별시','관악구'],['서울특별시','동작구'],['서울특별시','영등포구'],['서울특별시','마포구'],['서울특별시','강남구'],['서울특별시','금천구'],['서울특별시','구로구'],['서울특별시','송파구'],['경기도','성남시'],['경기도','수원시'],['경기도','안양시'],['경기도','고양시'],['인천광역시','남동구'],['대전광역시','유성구']];
  const SCH = ['한빛대학교','누리대학교','다솜대학교','바른대학교','새길대학교','가온전문대학','미리내대학교','라온대학교'];
  const MAJ = ['경영학','컴퓨터공학','산업디자인','국어국문학','통계학','미디어커뮤니케이션','행정학','경제학','심리학','전자공학'];
  const COMP = ['(주)한빛데이터','누리커머스','다온에듀','바름테크','새봄미디어','온새로랩','가람유통','하늘소프트','청록파트너스','미르솔루션','달빛게임즈','소담푸드'];
  const IND = ['IT·플랫폼','유통·커머스','교육','제조','미디어·콘텐츠','금융','공공기관','식품·외식'];
  const ENTRY = ['대학 재학생','이직 또는 경력 전환 고민자','졸업 후 6개월 이상 미취업자','졸업 후 6개월 이하 미취업자','재직자','기타'];
  const PROG = {
    2024:['서울형 청년인턴 직무캠프','ESG','2024 기업탐방_CEO TALK','2024 기업탐방_2박 3일','2024 기업탐방_원데이실무톡','2024 미래내일일경험_플젝형','RESAT_MD_1기','RESAT_콘디_1기'],
    2025:['RESAT_MD_2기','RESAT_콘디_2기','RESAT 자소서_1기','미니컴퍼니C_실전편_1회차','미니컴퍼니C_실전편_2회차','관악_IT직무프리뷰_프론트엔드','관악_IT직무프리뷰_백엔드','관악_엑셀활용법'],
    2026:['26년 서울형 청년인턴 직무캠프','관악_IT직무프리뷰_데이터분석','관악_취업글쓰기완성','관악_AI미니컴퍼니C_마케터편','관악_PPT활용법','관악_내일스터디','관악_면접리허설','미니컴퍼니C_실전편_3회차']
  };
  const programs = []; let pid = 1;
  for(const y of [2024,2025,2026]) PROG[y].forEach((name,i) => {
    const sm = 1 + Math.floor(i*1.3) % 11, sd = 1 + Math.floor(R()*20); const len = chance(.4) ? 0 : Math.floor(R()*40)+3;
    const s = new Date(Date.UTC(y, sm-1, sd)); const e = new Date(s.getTime() + len*864e5);
    programs.push({id:pid++, year:y, name, start_date:s.toISOString().slice(0,10), end_date:e.toISOString().slice(0,10)});
  });
  const admins = [
    {id:'a1', email:'career@openknowl.com', name:'유화경', role:'owner', is_active:true},
    {id:'a2', email:'manager@openknowl.com', name:'김운영', role:'admin', is_active:true},
    {id:'a3', email:'staff@openknowl.com', name:'박담당', role:'admin', is_active:true},
  ];
  const now = Date.now(); const N = 2400;
  const participants = [], enrollments = [], employments = [], status_history = [], change_log = [];
  let eid = 1, mid = 1, hid = 1, cid = 1;
  for(let i = 1; i <= N; i++){
    const by = 1990 + Math.floor(R()*14), bm = 1 + Math.floor(R()*12), bd = 1 + Math.floor(R()*28);
    const [sido, gu] = pick(GU); const st = (() => { const r = R(); return r<.44?'unknown':r<.66?'seeking':r<.86?'employed':r<.88?'startup':r<.95?'education':'other'; })();
    const created = now - Math.floor(R()*700)*864e5; const updated = created + Math.floor(R()*(now-created));
    const p = {
      id:i, code:'CL-' + String(i).padStart(6,'0'), name: pick(SUR) + pick(GIV) + pick(GIV),
      current_status: st, birth_date: chance(.85) ? `${by}-${pad(bm)}-${pad(bd)}` : null,
      nationality: chance(.25) ? (chance(.95) ? '대한민국' : pick(['베트남','중국','몽골'])) : null,
      residence_sido: chance(.88) ? sido : null, residence_gu: null,
      phone: `010-0000-${String(i).padStart(4,'0')}`,
      email: chance(.6) ? `user${String(i).padStart(4,'0')}@example.com` : null,
      school: chance(.45) ? pick(SCH) : null, major: null, graduation_year: null,
      education: chance(.4) ? pick(EDU) : null, desired_job: chance(.7) ? pick(JOBS) : null,
      note: chance(.04) ? pick(['재연락 희망 시간: 오후','다음 사업 안내 희망','이메일 수신 거부 요청']) : null,
      consent_job_info: chance(.6) ? chance(.8) : null, consent_marketing: chance(.5) ? chance(.6) : null,
      created_at: new Date(created).toISOString(), updated_at: new Date(updated).toISOString(),
      created_by: 'a2', updated_by: pick(['a1','a2','a3']), merged_into_id:null, deleted_at:null
    };
    if(p.residence_sido) p.residence_gu = gu;
    if(p.school){ p.major = pick(MAJ); p.graduation_year = chance(.7) ? by + 23 + Math.floor(R()*3) : null; }
    participants.push(p);
    // 참여 이력 (약 22%가 2개 이상 사업)
    const k = chance(.22) ? (chance(.25) ? 3 : 2) : 1; const used = new Set();
    for(let j=0;j<k;j++){ const pr = pick(programs); if(used.has(pr.id)) continue; used.add(pr.id);
      enrollments.push({id:eid++, participant_id:i, program_id:pr.id, completion_date:pr.end_date, entry_type: chance(.6) ? pick(ENTRY) : null}); }
    status_history.push({id:hid++, participant_id:i, from_status:null, to_status:'unknown', reason:'최초 등록(엑셀 이전)', changed_by:'a2', changed_at:p.created_at});
    if(st !== 'unknown') status_history.push({id:hid++, participant_id:i, from_status:'unknown', to_status:st, reason: pick(['전화 확인','사후관리 설문','담당자 확인']), changed_by:p.updated_by, changed_at:p.updated_at});
    if(st === 'employed' || st === 'startup'){
      if(chance(.15)){ // 이전 직장 이력
        employments.push({id:mid++, participant_id:i, kind:'employed', start_date:'2024-03-04', end_date:'2025-02-28', company:pick(COMP), industry:pick(IND), job_title:p.desired_job||pick(JOBS), employment_type:'계약직', work_region:'서울', is_current:false, source:'admin', updated_at:p.updated_at, updated_by:p.updated_by});
      }
      const sd = new Date(updated - Math.floor(R()*90)*864e5).toISOString().slice(0,10);
      employments.push({id:mid++, participant_id:i, kind: st === 'startup' ? 'startup' : 'employed', start_date:sd, end_date:null,
        company: st === 'startup' ? `${p.name.slice(0,1)}스튜디오` : pick(COMP), industry:pick(IND), job_title: p.desired_job || pick(JOBS),
        employment_type: st === 'startup' ? null : pick(['정규직','정규직','계약직','인턴']), work_region: pick(['서울','서울','경기','인천']),
        is_current:true, source: chance(.5)?'upload':'admin', updated_at:p.updated_at, updated_by:p.updated_by});
    }
  }
  // 동일인 의심 (같은 이름 + 같은 생년월일) 몇 쌍 만들기
  const duplicates = [];
  for(let n=0;n<14;n++){
    const a = participants[Math.floor(R()*N)], b = participants[Math.floor(R()*N)];
    if(a.id === b.id) continue; b.name = a.name; b.birth_date = a.birth_date;
    duplicates.push({id:n+1, participant_a:Math.min(a.id,b.id), participant_b:Math.max(a.id,b.id), reason:'same_name_birth', score:70, status:'pending'});
  }
  // 최근 수정 몇 건에 항목 수정 이력
  participants.slice().sort((a,b)=>b.updated_at.localeCompare(a.updated_at)).slice(0,40).forEach(p => {
    change_log.push({id:cid++, entity:'participants', entity_id:p.id, field:'desired_job', old_value:null, new_value:p.desired_job||'기획·PM', changed_by:p.updated_by, changed_at:p.updated_at});
  });
  const audit_log = [
    {id:1, admin_id:'a2', action:'upload_commit', target:'upload:3', detail:{filename:'2026_관악_가상명단.xlsx', rows:190}, at:new Date(now-3*864e5).toISOString()},
    {id:2, admin_id:'a3', action:'export_xlsx', target:'participants', detail:{rows:312, filter:'2026 · 미확인'}, at:new Date(now-2*864e5).toISOString()},
    {id:3, admin_id:'a1', action:'login', target:null, detail:null, at:new Date(now-864e5).toISOString()},
  ];
  return {programs, admins, participants, enrollments, employments, status_history, change_log, duplicates, audit_log, seq:{audit:4, hist:hid, chg:cid, emp:mid, pid:N+1, enr:eid, dup:100, prog:pid}};
}

/* =====================================================================
   데이터 계층 — 체험판(메모리). STEP 4에서 Supabase 구현으로 교체
   모든 함수는 비동기(Promise)로 Supabase와 같은 모양을 유지
   ===================================================================== */
function makeDemoStore(){
  const db = genDemo();
  const byId = new Map(db.participants.map(p => [p.id, p]));
  const progById = new Map(db.programs.map(p => [p.id, p]));
  let me = null;
  const enrOf = id => db.enrollments.filter(e => e.participant_id === id).map(e => ({...e, program: progById.get(e.program_id)}));
  const curEmp = id => db.employments.find(e => e.participant_id === id && e.is_current) || null;
  const nowISO = () => new Date().toISOString();
  const audit = (action, target, detail) => db.audit_log.push({id:db.seq.audit++, admin_id:me?.id, action, target, detail, at:nowISO()});
  const active = () => db.participants.filter(p => !p.merged_into_id && !p.deleted_at);
  const adminName = id => db.admins.find(a => a.id === id)?.name || '';
  function view(p){
    const en = enrOf(p.id).sort((a,b) => (b.program.year - a.program.year) || b.program.start_date.localeCompare(a.program.start_date));
    const emp = curEmp(p.id);
    return {...p, enroll: en, latest: en[0]?.program || null, emp, updated_by_name: adminName(p.updated_by)};
  }
  function filtered(f){
    const q = (f.q||'').trim().toLowerCase(); const qd = q.replace(/\D/g,'');
    return active().filter(p => {
      if(f.status && f.status !== 'all' && p.current_status !== f.status) return false;
      if(f.job && f.job !== 'all'){ const e = curEmp(p.id); if(p.desired_job !== f.job && e?.job_title !== f.job) return false; }
      if((f.year && f.year !== 'all') || (f.program && f.program !== 'all')){
        const en = enrOf(p.id);
        if(f.year && f.year !== 'all' && !en.some(e => e.program.year === +f.year)) return false;
        if(f.program && f.program !== 'all' && !en.some(e => e.program_id === +f.program)) return false;
      }
      if(q){
        const hit = p.name.toLowerCase().includes(q) || (p.email||'').toLowerCase().includes(q) || (qd.length >= 3 && (p.phone||'').replace(/\D/g,'').includes(qd)) || p.code.toLowerCase().includes(q);
        if(!hit) return false;
      }
      return true;
    }).map(view);
  }
  /* ----- STEP 3: 업로드 · 중복 통합 · 백업 (체험판 구현) ----- */
  const uploads = []; let upSeq = 4; const learned = new Map();
  const P_FIELDS = ['birth_date','birth_year','nationality','residence_sido','residence_gu','phone','email','school','major','graduation_year','education','desired_job','note','consent_job_info','consent_marketing'];
  const blank = v => v == null || v === '';
  function getProgram(p, undo){
    let pr = db.programs.find(x => x.year === p.year && x.name === p.name);
    if(!pr){ pr = {id:db.seq.prog++, year:p.year, name:p.name, start_date:p.start || null, end_date:p.end || null}; db.programs.push(pr); progById.set(pr.id, pr); undo.push({t:'program', id:pr.id}); }

  }

    if(!p){

  }
  const tableOf = rows => rows.map(r => ({...r}));

  return {

      const a = db.admins.find(x => x.email.toLowerCase() === String(email).trim().toLowerCase() && x.is_active);
      if(!a || pw !== 'careerlink2026!') { throw Error('아이디 또는 비밀번호가 맞지 않습니다. 5회 연속 틀리면 15분간 로그인이 잠깁니다.'); }

    },
    programs: () => db.programs,
    adminName,

    /* --- 중복 확인 · 통합 --- */
    async duplicates(){
      return db.duplicates.filter(d => d.status === 'pending' && byId.get(d.participant_a) && byId.get(d.participant_b))
        .map(d => ({...d, a:{...view(byId.get(d.participant_a)), emps:db.employments.filter(e => e.participant_id === d.participant_a)}, b:{...view(byId.get(d.participant_b)), emps:db.employments.filter(e => e.participant_id === d.participant_b)}}));

      const keep = byId.get(keepId), lose = byId.get(loseId); const t = nowISO(); const why = `${lose.code} 통합`;

      db.enrollments.filter(e => e.participant_id === loseId).forEach(e => {
        if(db.enrollments.some(x => x.participant_id === keepId && x.program_id === e.program_id)){ db.enrollments.splice(db.enrollments.indexOf(e), 1); dropped++; }
        else { e.participant_id = keepId; moved++; }
      });
      const keepCur = db.employments.some(e => e.participant_id === keepId && e.is_current);
      db.employments.filter(e => e.participant_id === loseId).forEach(e => { e.participant_id = keepId; if(keepCur) e.is_current = false; });

        const other = x.participant_a === loseId ? x.participant_b : x.participant_a;
        if(other === keepId){ x.status = 'merged'; return; }
        x.participant_a = Math.min(other, keepId); x.participant_b = Math.max(other, keepId);

      return {keep:keep.code, lose:lose.code, moved, dropped};
    },
    async dismissDuplicate(dupId){ const d = db.duplicates.find(x => x.id === dupId); d.status = 'dismissed'; d.resolved_by = me.id; d.resolved_at = nowISO(); audit('dismiss_duplicate', `duplicate:${dupId}`); },
    /* --- 백업 --- */
    async backup(){
      if(me.role !== 'owner') throw Error('전체 백업은 최고관리자만 내려받을 수 있습니다.');

    },
    async dupCount(){ return db.duplicates.filter(d => d.status === 'pending').length; },

    async auditLog(){ return db.audit_log.slice().sort((a,b) => b.at.localeCompare(a.at)).map(a => ({...a, by: adminName(a.admin_id)})); },
  };

function makeSupabaseStore(cfg){

  if(looksSecret) throw Error('config.js에 비밀 키(service_role/secret)가 들어 있습니다. 즉시 지우고 공개 키(anon 또는 publishable)로 바꿔 주세요. 비밀 키가 이미 GitHub에 올라갔다면 Supabase에서 키를 재발급해야 합니다.');
  if(!window.supabase) throw Error('Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.');
  let authStorage; try{ sessionStorage.setItem('cl.t', '1'); sessionStorage.removeItem('cl.t'); authStorage = sessionStorage; }catch{ authStorage = undefined; }
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, key, {auth:{persistSession:true, autoRefreshToken:true, storage:authStorage, storageKey:'careerlink-admin-auth'}});
  let me = null, programs = [], admins = [], sample = [];
  const staged = {};
  const friendly = m => /JWT|token|session/i.test(m) ? '로그인이 만료되었습니다. 다시 로그인해 주세요.' : /Failed to fetch|NetworkError/i.test(m) ? '서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.' : m;
  async function rpc(fn, args){ const {data, error} = await sb.rpc(fn, args || {}); if(error) throw Error(friendly(error.message)); return data; }
  async function q(p){ const {data, error, count} = await p; if(error) throw Error(friendly(error.message)); return count != null ? {data, count} : data; }
  async function all(table, select = '*', order = 'id'){
    const out = []; for(let from = 0; ; from += 1000){ const rows = await q(sb.from(table).select(select).order(order).range(from, from + 999)); out.push(...rows); if(rows.length < 1000) break; } return out;
  }
  const audit = (action, target, detail) => sb.from('audit_log').insert({action, target, detail}).then(() => {}, () => {});
  async function refreshCaches(){
    [programs, admins] = await Promise.all([q(sb.from('programs').select('*').order('year', {ascending:false}).order('name')), q(sb.from('admins').select('id,email,name,role,is_active,must_change_password'))]);
    sample = await q(sb.from('participants').select('name,phone,email,birth_date').is('merged_into_id', null).not('phone', 'is', null).not('birth_date', 'is', null).limit(6));
  }
  async function afterLogin(){
    const m = await rpc('me');
    if(!m){ await sb.auth.signOut(); throw Error('승인된 관리자 계정이 아닙니다. 최고관리자에게 관리자 등록을 요청하세요.'); }
    me = m; await refreshCaches(); return me;
  }
  return {
    live: true,
    async restore(){ const {data} = await sb.auth.getSession(); if(!data.session) return null; try{ return await afterLogin(); }catch{ return null; } },
    async login(email, pw){
      const {error} = await sb.auth.signInWithPassword({email:String(email).trim(), password:pw});
      if(error) throw Error(/invalid/i.test(error.message) ? '아이디 또는 비밀번호가 맞지 않습니다.' : /rate|many/i.test(error.message) ? '로그인 시도가 너무 많습니다. 잠시 뒤 다시 시도해 주세요.' : friendly(error.message));
      const m = await afterLogin(); await audit('login'); return m;
    },
    async logout(reason){ await audit('logout', null, reason ? {reason} : null); await sb.auth.signOut(); me = null; },
    async changePassword(cur, next){
      if(next.length < 10 || !/[A-Za-z]/.test(next) || !/\d/.test(next)) throw Error('새 비밀번호는 10자 이상, 영문과 숫자를 함께 써 주세요.');
      const {error: e1} = await sb.auth.signInWithPassword({email:me.email, password:cur}); if(e1) throw Error('현재 비밀번호가 맞지 않습니다.');
      const {error: e2} = await sb.auth.updateUser({password:next}); if(e2) throw Error(friendly(e2.message));
      await rpc('mark_password_changed'); me.must_change_password = false; return true;
    },
    programs: () => programs,
    adminName: id => admins.find(a => a.id === id)?.name || '',
    samplePeople: n => sample.slice(0, n),
    async admins(){ admins = await q(sb.from('admins').select('*').order('created_at')); return admins; },
    async registerAdmin(email, name, role){ const r = await rpc('register_admin', {admin_email:email, admin_name:name, admin_role:role}); await this.admins(); return r; },
    async setAdminActive(id, active){ await rpc('set_admin_active', {admin_id:id, active}); await this.admins(); },
    async stats(){ return rpc('dashboard_stats'); },
    async list(f, sort, dir, page, size){ return rpc('search_participants', {f, sort, dir, page, size}); },
    async counts(f){ return rpc('status_counts', {f}); },
    async exportRows(f){
      const out = []; for(let page = 1; ; page++){ const r = await rpc('search_participants', {f, sort:'code', dir:'asc', page, size:1000}); out.push(...r.rows); if(out.length >= r.total || !r.rows.length) break; }
      await audit('export_xlsx', 'participants', {rows:out.length, filter:f}); return out;
    },
    async get(id){ return rpc('participant_detail', {pid:id}); },
    async update(id, patch, reason){ return rpc('update_participant', {pid:id, patch, reason: reason || null}); },
    async create(data, program){ const r = await rpc('create_participant', {data, program: program || null}); await refreshCaches(); return r; },
    async addEmployment(id, e){ return rpc('add_employment', {pid:id, e}); },
    async endEmployment(id, empId, endDate){ return rpc('end_employment', {pid:id, emp_id:empId, end_on:endDate}); },
    async auditLog(){ const r = await q(sb.from('audit_log').select('*').order('at', {ascending:false}).limit(300)); return r.map(a => ({...a, by: this.adminName(a.admin_id)})); },
    /* 업로드 */
    async aliases(){ const r = await q(sb.from('column_aliases').select('alias,field_key')); return Object.fromEntries(r.map(x => [x.alias, x.field_key])); },
    async saveAliases(map){ await q(sb.from('column_aliases').upsert(Object.entries(map).map(([alias, field_key]) => ({alias, field_key})))); },
    async lookup({phones, emails, names}){
      const out = new Map(); const chunk = (a, n) => { const r = []; for(let i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r.length ? r : [[]]; };
      const P = chunk(phones, 500), Em = chunk(emails, 500), N = chunk(names, 500);
      for(let i = 0; i < Math.max(P.length, Em.length, N.length); i++){ (await rpc('upload_lookup', {phones:P[i] || [], emails:Em[i] || [], names:N[i] || []})).forEach(p => out.set(p.id, p)); }
      return [...out.values()];
    },
    async stage(meta, rows){
      const id = await rpc('upload_create', {meta:{...meta, total:rows.length}});
      const slim = rows.map(r => ({idx:r.idx, rowNo:r.rowNo, n:r.n, errors:r.errors, warnings:r.warnings, info:r.info, decision:r.decision, match:r.match ? {pid:r.match.pid, why:r.match.why} : null, dupOf:r.dupOf, inFileOf:r.inFileOf}));
      for(let i = 0; i < slim.length; i += 500) await rpc('upload_add_rows', {upload_id:id, rows:slim.slice(i, i + 500)});
      staged[id] = rows; return id;
    },
    async commitChunk(id, from, to){
      const res = await rpc('upload_commit_chunk', {upload_id:id, from_idx:from, to_idx:to});
      const rows = staged[id] || []; res.forEach(x => { const r = rows[x.idx]; if(r){ r.result = x.result; r.pid = x.pid; r.code = x.code; } });
      return {done:to};
    },
    async finishUpload(id){ const s = await rpc('upload_finish', {upload_id:id}); await refreshCaches(); return s; },
    async listUploads(){ return rpc('upload_list'); },
    async uploadRows(id){
      const out = []; for(let from = 0; ; from += 1000){ const r = await q(sb.from('upload_rows').select('*').eq('upload_id', id).order('idx').range(from, from + 999)); out.push(...r); if(r.length < 1000) break; }
      return out.map(r => ({idx:r.idx, rowNo:r.row_no, n:r.normalized || {program:{}}, errors:r.errors || [], warnings:r.warnings || [], info:r.info || [], decision:r.decision, dupOf:r.dup_of, match:r.match_participant_id ? {pid:r.match_participant_id} : null, inFileOf:r.in_file_of, result:r.result, code:r.participant_code}));
    },
    async revertUpload(id){ await rpc('upload_revert', {upload_id:id}); await refreshCaches(); return true; },
    /* 중복 · 통합 */
    async duplicates(){ return rpc('list_duplicates'); },
    async merge(dupId, keepId){ const r = await rpc('merge_participants', {dup_id:dupId, keep_id:keepId}); await refreshCaches(); return r; },
    async dismissDuplicate(dupId){ await rpc('dismiss_duplicate', {dup_id:dupId}); },
    async dupCount(){ const r = await q(sb.from('duplicate_candidates').select('id', {count:'exact', head:true}).eq('status', 'pending')); return r?.count || 0; },
    /* 백업 · 운영 */
    async backup(){
      if(me?.role !== 'owner') throw Error('전체 백업은 최고관리자만 내려받을 수 있습니다.');
      const t = {};
      for(const [k, ord] of [['participants','id'],['programs','id'],['enrollments','id'],['employments','id'],['status_history','id'],['change_log','id'],['duplicate_candidates','id'],['consent_records','id'],['survey_responses','id'],['admins','created_at']]) t[k] = await all(k, '*', ord);
      t.admins = t.admins.map(a => ({id:a.id, email:a.email, name:a.name, role:a.role, is_active:a.is_active}));
      await audit('backup_export', 'all', {rows:t.participants.length}); return t;
    },
    async lastBackup(){ const r = await q(sb.from('audit_log').select('at').eq('action', 'backup_export').order('at', {ascending:false}).limit(1)); return r[0]?.at || null; },
    async dbUsage(){ try{ return await rpc('db_usage'); }catch{ return null; } },
  };
}

function yearChart(ys){
  if(!ys || !ys.length || !ys.some(y => y.enrollments)) return `<div class="empty">아직 등록된 사업 참여 이력이 없습니다. 엑셀 업로드나 참여자 등록을 하면 연도별 현황이 나타납니다.</div>`;
  const W = 560, H = 230, L = 44, B = 32, T = 16; const max = Math.max(...ys.map(y => y.enrollments)) * 1.12;
  const step = Math.pow(10, Math.floor(Math.log10(max))) ; const tickStep = max/step > 5 ? step : step/2; const ticks = []; for(let v = 0; v <= max; v += tickStep) ticks.push(v);
  const Y = v => T + (H - T - B) * (1 - v / max); const gw = (W - L - 12) / ys.length; const bw = Math.min(42, gw/3.2);
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="사업 연도별 중복 제외 인원과 참여 건수">
    ${ticks.map(v => `<line x1="${L}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)">${fmtNum(v)}</text>`).join('')}
    ${ys.map((y,i) => { const cx = L + gw*i + gw/2; return `
      <rect x="${cx-bw-3}" y="${Y(y.unique)}" width="${bw}" height="${Y(0)-Y(y.unique)}" rx="4" fill="var(--accent)"/>
      <rect x="${cx+3}" y="${Y(y.enrollments)}" width="${bw}" height="${Y(0)-Y(y.enrollments)}" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
      <text x="${cx-bw/2-3}" y="${Y(y.unique)-6}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">${fmtNum(y.unique)}</text>
      <text x="${cx+bw/2+3}" y="${Y(y.enrollments)-6}" text-anchor="middle" font-size="11.5" fill="var(--sub)">${fmtNum(y.enrollments)}</text>
      <text x="${cx}" y="${H-10}" text-anchor="middle" font-size="12.5" fill="var(--ink)">${y.year}년</text>`; }).join('')}
  </svg></div><div class="legend"><span><i style="background:var(--accent)"></i>중복 제외 인원</span><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>사업 참여 건수</span></div>`;
}
function statusStack(by, total){
  return `<div class="bars"><div class="stack" role="img" aria-label="현재상태 분포">${STATUS_ORDER.map(s => `<span title="${STATUS[s]} ${by[s]}명" style="width:${total ? by[s]/total*100 : 0}%;background:${STATUS_COLOR[s]}"></span>`).join('')}</div></div>

function tableHTML(rows, cols, sort, dir, selId){
  const cs = cols.map(k => COLS.find(c => c.key === k)).filter(Boolean);
  if(!rows.length) return `<div class="tw"><div class="empty">조건에 맞는 참여자가 없습니다. 검색어나 필터를 바꿔 보세요.</div></div>`;
  return `<div class="tw"><table class="grid"><thead><tr>${cs.map(c => `<th scope="col"><button type="button" data-sort="${c.key}">${c.label}${sort === c.key ? `<span class="arr">${dir === 'asc' ? '▲' : '▼'}</span>` : ''}</button></th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr data-open="${r.id}" class="${selId === r.id ? 'sel' : ''}">${cs.map(c => `<td class="${c.cls||''}">${c.get(r) ?? ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function pager(total, page, size, attr, unit = '명'){
  const pages = Math.max(1, Math.ceil(total/size)); const lo = Math.max(1, Math.min(page-3, pages-6)); const hi = Math.min(pages, lo+6);
  const btns = []; for(let i = lo; i <= hi; i++) btns.push(`<button type="button" ${attr}="${i}" class="${i === page ? 'on' : ''}" aria-label="${i}쪽">${i}</button>`);
  return `<div class="pager"><span class="num">${fmtNum(Math.min(total,(page-1)*size+1))}–${fmtNum(Math.min(total,page*size))} / ${fmtNum(total)}${unit}</span>
    <div class="pg"><button type="button" ${attr}="${Math.max(1,page-1)}" ${page === 1 ? 'disabled' : ''} aria-label="이전 쪽">‹</button>${btns.join('')}<button type="button" ${attr}="${Math.min(pages,page+1)}" ${page === pages ? 'disabled' : ''} aria-label="다음 쪽">›</button></div></div>`;
}

const curYY = () => new Date().getFullYear() % 100;

async function commitUpload(){

    const hdr = u.sheets[u.sheet].aoa[u.headerRow] || []; const mapping = {}; Object.entries(u.mapping).forEach(([i, k]) => { if(hk(hdr[i])) mapping[String(hdr[i]).trim()] = k; });
    u.uploadId = await store.stage({filename:u.filename, sheet:u.sheet, mapping, overwrite:u.overwrite}, u.rows);
    for(let i = 0; i < u.rows.length; i += CHUNK){
      await store.commitChunk(u.uploadId, i, Math.min(u.rows.length, i + CHUNK));
      u.progress = Math.min(u.rows.length, i + CHUNK); const b = $('#up-bar'); if(b){ b.style.width = `${u.progress / u.rows.length * 100}%`; $('#up-prog').textContent = `${fmtNum(u.progress)} / ${fmtNum(u.rows.length)}행`; }

}

    <div class="cmp">${side(d.a, d.b, d)}${side(d.b, d.a, d)}</div></section>`).join('') : '<div class="panel"><div class="empty">확인할 중복 의심이 없습니다.</div></div>'}

async function downloadBackup(){
  if(!window.XLSX){ toast('엑셀 라이브러리를 불러오지 못했습니다.'); return; }
  try{
    const t = await store.backup(); const wb = XLSX.utils.book_new();
    const NAMES = {participants:'참여자', programs:'사업', enrollments:'참여 이력', employments:'취업 기록', status_history:'상태 이력', change_log:'수정 이력', duplicates:'중복 의심', admins:'관리자'};
    Object.entries(t).forEach(([k, rows]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.map(r => Object.fromEntries(Object.entries(r).map(([a, b]) => [a, b != null && typeof b === 'object' ? JSON.stringify(b) : b])))), NAMES[k] || k));
    const fn = `커리어링크_전체백업_${todayISO().replace(/-/g,'')}.xlsx`;
    try{ XLSX.writeFile(wb, fn); toast(`${fn}을 내려받았습니다.`); }catch{ toast('이 화면에서는 파일 저장이 막혀 있습니다. 실제 배포 주소에서 다시 시도해 주세요.'); }
    renderMain();
  }catch(e){ toast(e.message); }
}

document.addEventListener('click', async ev => {
  const t = ev.target; let el;
  if((el = t.closest('[data-up]'))){
    const a = el.dataset.up; const u = st.up;
    if(a === 'reset'){ st.up = up0(); return renderMain(); }
    if(a === 'sample-std') return startUpload('가상예시_표준양식.xlsx', sampleSheets('std'));
    if(a === 'sample-gw') return startUpload('가상예시_관악드림온형.xlsx', sampleSheets('gw'));
    if(a === 'analyze') return analyzeUpload();
    if(a === 'to-map'){ u.step = 'map'; u.err = ''; return renderMain(); }
    if(a === 'commit'){ const c = upCounts(u.rows); const nNew = u.rows.filter(r => !r.errors.length && r.decision === 'new').length, nLink = u.rows.filter(r => !r.errors.length && r.decision === 'link').length;
      return modal(`<h3>${fmtNum(nNew + nLink)}행을 반영할까요?</h3><p>신규 등록 ${fmtNum(nNew)}명, 기존 참여자에 연결 ${fmtNum(nLink)}건을 반영하고, 오류 ${fmtNum(c.error)}행과 건너뛴 ${fmtNum(c.skip)}행은 제외합니다. 반영한 뒤에도 업로드 기록에서 통째로 되돌릴 수 있습니다.</p><div class="acts"><button class="btn ghost" type="button" data-act="modal-close">취소</button><button class="btn" type="button" data-up="commit-go">반영</button></div>`); }
    if(a === 'commit-go') return commitUpload();
    if(a === 'export-check') return exportUploadRows(u.rows, '업로드검사');
    if(a === 'export-result') return exportUploadRows(u.rows, `업로드${u.uploadId}_결과`);
    if(a === 'go-people'){ st.f = {q:'', year:'all', program:'all', status:'all', job:'all'}; st.sort = 'updated_at'; st.dir = 'desc'; st.page = 1; return setView('people'); }
    if(a === 'backup') return downloadBackup();
    if(a === 'revert-go'){ const id = +el.dataset.id; closeModal(); try{ await store.revertUpload(id); if(st.up.uploadId === id) st.up = up0(); toast(`업로드 #${id}을 되돌렸습니다.`); }catch(e){ toast(e.message); } return renderMain(); }
    return;
  }

async function submitPerson(fd){

async function openDetail(id){

function closeDetail(force){

}
async function save(){
  if(st.saving) return; st.saving = true; document.querySelectorAll('[data-act="save"]').forEach(b => { b.disabled = true; b.textContent = '저장 중…'; });
  try{ await saveInner(); }catch(e){ toast(e.message); refreshDrawer(); } finally{ st.saving = false; }
}
async function saveInner(){
  const d = st.draft; st.errs = validate(d);
  if(Object.keys(st.errs).length){ refreshDrawer(); toast('입력값을 확인해 주세요.'); return; }
  const patch = {}; const map = {birth:'birth_date'};
  for(const k of dirtyKeys()){
    let v = d[k];
    if(k === 'birth') v = v ? yyToBirth(v) : null;
    else if(k === 'phone') v = v ? normPhone(v) : null;
    else if(k === 'email') v = v ? v.trim().toLowerCase() : null;
    else if(k === 'graduation_year') v = v ? +v : null;
    else if(k.startsWith('consent')) v = v === '' ? null : v === 'Y';
    else if(typeof v === 'string') v = v.trim() || null;
    patch[map[k] || k] = v;
  }
  st.detail = await store.update(st.detail.id, patch, st.reason.trim());
  st.draft = draftFrom(st.detail); st.reason = ''; refreshDrawer(); toast(`저장했습니다. 변경 항목 ${Object.keys(patch).length}개가 이력에 남았습니다.`);
  renderMain();
}
async function exportXlsx(f, name){
  if(!window.XLSX){ toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); return; }
  const rows = await store.exportRows(f);
  const data = rows.map(r => ({
    '관리번호':r.code, '사업 연도':r.latest?.year ?? '', '사업명':r.enroll.map(e => e.program.name).join(' / '), '운영기간': r.latest ? `${fmtD(r.latest.start_date)}~${fmtD(r.latest.end_date)}` : '',
    '이름':r.name, '현재상태':STATUS[r.current_status], '생년월일':birthToYY(r.birth_date), '나이(오늘 기준)':r.birth_date ? age(r.birth_date) : '', '국적':r.nationality||'', '거주지':[r.residence_sido,r.residence_gu].filter(Boolean).join(' '),
    '휴대전화':r.phone||'', '이메일':r.email||'', '학교명':r.school||'', '전공':r.major||'', '졸업 연도':r.graduation_year||'', '학력':r.education||'', '희망직무':r.desired_job||'',
    '취업(창업)일자':r.emp?.start_date||'', '회사명':r.emp?.company||'', '업종':r.emp?.industry||'', '직무':r.emp?.job_title||'', '고용형태':r.emp?.employment_type||'', '근무지역':r.emp?.work_region||'',
    '최초 등록일':fmtD(r.created_at), '최종 수정일':fmtDT(r.updated_at), '수정 담당자':r.updated_by_name
  }));
  const ws = XLSX.utils.json_to_sheet(data); ws['!cols'] = Object.keys(data[0] || {}).map(k => ({wch: Math.max(8, k.length * 2)}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '참여자');
  const fn = `커리어링크_${name}_${todayISO().replace(/-/g,'')}_${st.user.name}.xlsx`;
  try{ XLSX.writeFile(wb, fn); toast(`${fmtNum(rows.length)}명을 ${fn}로 내려받았습니다. 특이사항은 보안상 제외됩니다.`); }
  catch{ toast('이 화면에서는 파일 저장이 막혀 있습니다. 실제 배포 주소에서 다시 시도해 주세요.'); }

function setView(v){

  const t = ev.target;

  if((el = q('[data-go-people]'))){ st.f = {q:'', year:'all', program:'all', status:'all', job:'all'}; st.page = 1; return setView('people'); }

  if((el = q('[data-page]'))){ st.page = +el.dataset.page; await renderMain(); $('.tw')?.scrollTo(0,0); return; }
  if((el = q('[data-epage]'))){ st.epage = +el.dataset.epage; return renderMain(); }
  if((el = q('[data-est]'))){ st.ef.status = el.dataset.est; st.epage = 1; return renderMain(); }
  if((el = q('[data-tab]'))){ st.tab = el.dataset.tab; return refreshDrawer(false); }
  if((el = q('[data-end-emp]'))) return endEmpModal(+el.dataset.endEmp);
  if((el = q('[data-admin-active]'))){ const [id, on] = el.dataset.adminActive.split(':'); try{ await store.setAdminActive(id, on === '1'); toast(on === '1' ? '다시 사용하도록 바꿨습니다.' : '사용을 중지했습니다. 이 계정은 더 이상 데이터를 볼 수 없습니다.'); }catch(e){ toast(e.message); } return renderMain(); }
  if((el = q('[data-act]'))){
    const a = el.dataset.act;
    if(a === 'close'){ if(el.classList.contains('scrim') && t !== el) return; return closeDetail(); }
    if(a === 'logout'){ await store.logout(); st.user = null; st.detail = null; render(); return toast('로그아웃했습니다.'); }
    if(a === 'pw') return pwModal();
    if(a === 'modal-close') return closeModal();
    if(a === 'discard'){ closeModal(); st.draft = draftFrom(st.detail); const n = confirmClose.next; confirmClose.next = null; return n && n(); }
    if(a === 'reset'){ st.f = {q:'', year:'all', program:'all', status:'all', job:'all'}; st.page = 1; return renderMain(); }
    if(a === 'cols'){ st.colOpen = !st.colOpen; return renderMain(); }
    if(a === 'cols-default'){ st.cols = DEFAULT_COLS.slice(); store_ls.set('cl.cols', st.cols); return renderMain(); }
    if(a === 'cols-all'){ st.cols = COLS.map(c => c.key); store_ls.set('cl.cols', st.cols); return renderMain(); }

    if(a === 'add-emp') return empModal();
    if(a === 'new-person') return personModal();
  }

});

  const t = ev.target;

    let v = t.value;
    if(t.dataset.d === 'birth'){ const d = v.replace(/\D/g,'').slice(0,6); v = d.length > 4 ? `${d.slice(0,2)}-${d.slice(2,4)}-${d.slice(4)}` : d.length > 2 ? `${d.slice(0,2)}-${d.slice(2)}` : d; if(v !== t.value) t.value = v; }
    st.draft[t.dataset.d] = v; if(st.errs[t.dataset.d]) delete st.errs[t.dataset.d];
    // 라벨 '수정됨' 표시와 하단 저장 버튼만 갱신 (입력 중 커서 유지)
    const f = t.closest('.f'); f?.classList.toggle('changed', String(v) !== String(draftFrom(st.detail)[t.dataset.d])); f?.classList.remove('bad');
    const n = dirtyKeys().length; const msg = $('.df .msg'); if(msg) msg.textContent = n ? `수정한 항목 ${n}개 · 저장하면 변경 이력에 남습니다` : '수정할 항목을 바로 고치면 됩니다';
    document.querySelectorAll('[data-act="save"],[data-act="revert"]').forEach(b => b.disabled = !n);
    if(t.dataset.d === 'birth' && (v.length === 8 || v.length === 0)) refreshDrawer();
  }
  if(t.dataset.reason !== undefined) st.reason = t.value;
});
async function handleSubmit(f){
  const fd = new FormData(f);
  if(f.id === 'loginForm'){
    st.loginEmail = String(fd.get('email') || '');
    st.busy = true; st.loginErr = ''; render();
    try{ st.user = await store.login(fd.get('email'), fd.get('pw')); st.busy = false; st.lastAct = Date.now(); const h = location.hash.slice(1); st.view = VIEWS.includes(h) && (st.user.role === 'owner' || !['logs','accounts','backup'].includes(h)) ? h : 'dashboard'; render(); toast(`${st.user.name}님, 로그인했습니다.`); if(st.user.must_change_password && !DEMO) setTimeout(() => { pwModal(); toast('처음 로그인했습니다. 임시 비밀번호를 새 비밀번호로 바꿔 주세요.'); }, 300); }
    catch(e){ st.busy = false; st.loginErr = e.message; render(); }
    return;
  }
  if(f.id === 'filters'){ st.f.q = String(fd.get('q') || '').trim(); st.page = 1; return renderMain(); }
  if(f.id === 'personForm') return submitPerson(fd);
  if(f.id === 'adminForm'){ try{ await store.registerAdmin(String(fd.get('email')).trim(), String(fd.get('name')).trim(), fd.get('role')); toast('관리자로 등록했습니다. 임시 비밀번호로 로그인하면 비밀번호 변경을 안내합니다.'); }catch(e){ toast(e.message); } return renderMain(); }
  if(f.id === 'empForm'){
    const e = Object.fromEntries(fd); if(!e.company.trim()){ toast('회사명을 입력하세요.'); return; }
    for(const k in e) e[k] = String(e[k]).trim() || null;
    closeModal(); st.detail = await store.addEmployment(st.detail.id, e); st.draft = draftFrom(st.detail); refreshDrawer(); renderMain(); toast('취업·창업 정보를 등록했습니다. 상태 변경이 이력에 남았습니다.'); return;
  }
  if(f.id === 'endForm'){ closeModal(); st.detail = await store.endEmployment(st.detail.id, +f.dataset.emp, fd.get('end')); st.draft = draftFrom(st.detail); refreshDrawer(); renderMain(); toast('종료 처리했습니다. 현재상태가 구직 중으로 바뀌었습니다.'); return; }
  if(f.id === 'pwForm'){
    const err = $('#pw-err');
    if(fd.get('next') !== fd.get('next2')){ err.innerHTML = '<span class="err">새 비밀번호가 서로 다릅니다.</span>'; return; }
    try{ await store.changePassword(fd.get('cur'), fd.get('next')); closeModal(); toast(DEMO ? '비밀번호를 바꿨습니다. (체험판에서는 실제로 바뀌지 않습니다)' : '비밀번호를 바꿨습니다. 다음 로그인부터 새 비밀번호를 쓰세요.'); renderMain(); }
    catch(e){ err.innerHTML = `<span class="err">${E(e.message)}</span>`; }
  }
}
// 저장 중에 버튼을 다시 누르거나 Enter를 눌러도 한 번만 처리되도록 막습니다
document.addEventListener('submit', async ev => {
  ev.preventDefault(); const f = ev.target;
  if(f.dataset.busy) return;
  f.dataset.busy = '1';
  const btns = [...f.querySelectorAll('button[type=submit]')];
  btns.forEach(b => { b.disabled = true; b.dataset.label = b.textContent; if(f.id !== 'filters' && f.id !== 'loginForm') b.textContent = '처리 중…'; });
  try{ await handleSubmit(f); }
  catch(e){ toast(e.message); }
  finally{ delete f.dataset.busy; if(f.isConnected) btns.forEach(b => { b.disabled = false; b.textContent = b.dataset.label; }); }
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape'){ if($('#modal').innerHTML) return closeModal(); if(st.detail) return closeDetail(); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(st.user && VIEWS.includes(h) && h !== st.view) setView(h); });

/* ---------- 자동 로그아웃 ---------- */
['click','keydown','input','scroll'].forEach(e => document.addEventListener(e, () => { st.lastAct = Date.now(); st.warned = false; }, {passive:true, capture:true}));
function updateIdle(){
  const el = $('#idle'); if(!el || !st.user) return;
  const left = IDLE_MIN*60 - Math.floor((Date.now() - st.lastAct)/1000);
  el.textContent = `자동 로그아웃까지 ${Math.max(0, Math.floor(left/60))}분 ${pad(Math.max(0,left%60))}초`;
}
setInterval(async () => {
  if(!st.user) return; updateIdle();
  const idle = (Date.now() - st.lastAct) / 60000;
  if(idle >= IDLE_MIN){ await store.logout('idle'); st.user = null; st.detail = null; closeModal(); st.loginErr = `${IDLE_MIN}분 동안 사용하지 않아 자동으로 로그아웃했습니다. 다시 로그인해 주세요.`; render(); }
  else if(idle >= IDLE_MIN - 2 && !st.warned){ st.warned = true; toast('2분 뒤 자동으로 로그아웃됩니다. 계속하려면 화면을 눌러 주세요.'); }
}, 1000);

async function boot(){
  if(store.restore){
    $('#app').innerHTML = demoBar() + '<div class="login"><p style="color:var(--sub)">로그인 상태를 확인하고 있습니다…</p></div>';
    try{ const u = await store.restore(); if(u){ st.user = u; st.lastAct = Date.now(); const h = location.hash.slice(1); st.view = VIEWS.includes(h) && (u.role === 'owner' || !['logs','accounts','backup'].includes(h)) ? h : 'dashboard'; } }catch{}
  }
  render();
  if(st.user?.must_change_password && !DEMO) setTimeout(() => { pwModal(); toast('처음 로그인했습니다. 임시 비밀번호를 새 비밀번호로 바꿔 주세요.'); }, 300);
}
boot();
</script>
